<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrinking Navbar on Scroll</title>
<style>
  /* Reset */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    min-height: 2000px; /* for scroll demo */
  }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: #3498db;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    transition: all 0.3s ease;
    z-index: 1000;
  }

  .navbar.shrink {
    padding: 10px 30px;
    background-color: #2980b9;
  }

  .navbar a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
  }

  .logo {
    font-size: 24px;
    font-weight: bold;
    transition: font-size 0.3s ease;
  }

  .navbar.shrink .logo {
    font-size: 18px;
  }

  /* Content for demo */
  .content {
    margin-top: 100px;
    padding: 20px;
  }
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar" id="navbar">
  <div class="logo">MyLogo</div>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- Content -->
<div class="content">
  <h1>Scroll Down to See Navbar Shrink</h1>
  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scroll down to see the effect.</p>
  <p>Keep scrolling...</p>
  <p>More content here...</p>
  <p>More content here...</p>
  <p>More content here...</p>
</div>

<script>
  // Get navbar
  const navbar = document.getElementById("navbar");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 50) {
      navbar.classList.add("shrink");
    } else {
      navbar.classList.remove("shrink");
    }
  });
</script>

</body>
</html>
