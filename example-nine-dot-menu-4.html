<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar with 9-Dot Menu Popup</title>
  <style>
    /* Basic Reset */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff; /* White navbar */
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
    }

    /* 9-dot Menu Button */
    .menu-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ccc; /* Gray background */
      cursor: pointer;
      transition: background-color 0.3s;
      position: relative;
    }

    .menu-button.active {
      background-color: #007bff; /* Standard blue when active */
    }

    .menu-button svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      transition: fill 0.3s;
    }

    /* Popup App List */
    .app-list {
      display: none;
      position: absolute;
      top: 60px; /* Below navbar */
      right: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 10px;
      min-width: 200px;
      z-index: 1000;
    }

    .app-list.active {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      background-color: #f0f0f0;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .app-item:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">MySite</div>
    
    <div aria-label="Menu" role="button" tabindex="0" class="menu-button" id="menuButton">
      <svg viewBox="0 0 24 24">
        <path d="M18.5 1A1.5 1.5 0 0 0 17 2.5v3A1.5 1.5 0 0 0 18.5 7h3A1.5 1.5 0 0 0 23 5.5v-3A1.5 1.5 0 0 0 21.5 1h-3zm0 8a1.5 1.5 0 0 0-1.5 1.5v3a1.5 1.5 0 0 0 1.5 1.5h3a1.5 1.5 0 0 0 1.5-1.5v-3A1.5 1.5 0 0 0 21.5 9h-3zm-16 8A1.5 1.5 0 0 0 1 18.5v3A1.5 1.5 0 0 0 2.5 23h3A1.5 1.5 0 0 0 7 21.5v-3A1.5 1.5 0 0 0 5.5 17h-3zm8 0A1.5 1.5 0 0 0 9 18.5v3a1.5 1.5 0 0 0 1.5 1.5h3a1.5 1.5 0 0 0 1.5-1.5v-3a1.5 1.5 0 0 0-1.5-1.5h-3zm8 0a1.5 1.5 0 0 0-1.5 1.5v3a1.5 1.5 0 0 0 1.5 1.5h3a1.5 1.5 0 0 0 1.5-1.5v-3a1.5 1.5 0 0 0-1.5-1.5h-3zm-16-8A1.5 1.5 0 0 0 1 10.5v3A1.5 1.5 0 0 0 2.5 15h3A1.5 1.5 0 0 0 7 13.5v-3A1.5 1.5 0 0 0 5.5 9h-3zm0-8A1.5 1.5 0 0 0 1 2.5v3A1.5 1.5 0 0 0 2.5 7h3A1.5 1.5 0 0 0 7 5.5v-3A1.5 1.5 0 0 0 5.5 1h-3zm8 0A1.5 1.5 0 0 0 9 2.5v3A1.5 1.5 0 0 0 10.5 7h3A1.5 1.5 0 0 0 15 5.5v-3A1.5 1.5 0 0 0 13.5 1h-3zm0 8A1.5 1.5 0 0 0 9 10.5v3a1.5 1.5 0 0 0 1.5 1.5h3a1.5 1.5 0 0 0 1.5-1.5v-3A1.5 1.5 0 0 0 13.5 9h-3z"></path>
      </svg>
    </div>

    <!-- Popup App List -->
    <div class="app-list" id="appList">
      <div class="app-item">App 1</div>
      <div class="app-item">App 2</div>
      <div class="app-item">App 3</div>
      <div class="app-item">App 4</div>
      <div class="app-item">App 5</div>
      <div class="app-item">App 6</div>
    </div>
  </nav>

  <script>
    const menuButton = document.getElementById('menuButton');
    const appList = document.getElementById('appList');

    menuButton.addEventListener('click', () => {
      menuButton.classList.toggle('active');
      appList.classList.toggle('active');
    });

    // Optional: Close app list if clicked outside
    document.addEventListener('click', (e) => {
      if (!menuButton.contains(e.target) && !appList.contains(e.target)) {
        menuButton.classList.remove('active');
        appList.classList.remove('active');
      }
    });
  </script>
</body>
</html>
