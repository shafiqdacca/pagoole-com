<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar with 9 Dot Menu</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fa;
    }

    /* Navbar Style */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #1a73e8;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #1a73e8;
    }

    /* 9-dot menu icon */
    .menu-icon {
      width: 28px;
      height: 28px;
      cursor: pointer;
      color: #555;
      transition: color 0.3s ease;
    }

    .menu-icon:hover {
      color: #1a73e8;
    }

    /* Optional: App dropdown menu */
    .dropdown {
      position: absolute;
      top: 55px;
      right: 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      display: none;
      padding: 10px;
      width: 150px;
    }

    .dropdown.active {
      display: block;
    }

    .dropdown a {
      display: block;
      padding: 8px;
      text-decoration: none;
      color: #333;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .dropdown a:hover {
      background: #f1f3f4;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Pagoole</div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>

    <!-- 9-dot menu icon -->
    <svg class="menu-icon" id="appMenuBtn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="5" cy="5" r="2"/>
      <circle cx="12" cy="5" r="2"/>
      <circle cx="19" cy="5" r="2"/>
      <circle cx="5" cy="12" r="2"/>
      <circle cx="12" cy="12" r="2"/>
      <circle cx="19" cy="12" r="2"/>
      <circle cx="5" cy="19" r="2"/>
      <circle cx="12" cy="19" r="2"/>
      <circle cx="19" cy="19" r="2"/>
    </svg>

    <!-- Dropdown Menu -->
    <div class="dropdown" id="appMenu">
      <a href="#">App 1</a>
      <a href="#">App 2</a>
      <a href="#">App 3</a>
    </div>
  </nav>

  <script>
    // Toggle dropdown
    const appBtn = document.getElementById('appMenuBtn');
    const appMenu = document.getElementById('appMenu');

    appBtn.addEventListener('click', () => {
      appMenu.classList.toggle('active');
    });

    // Close menu if clicked outside
    document.addEventListener('click', (e) => {
      if (!appMenu.contains(e.target) && !appBtn.contains(e.target)) {
        appMenu.classList.remove('active');
      }
    });
  </script>

</body>
</html>
